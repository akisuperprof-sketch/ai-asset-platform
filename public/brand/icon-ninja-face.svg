<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <g transform="translate(0, 0)">
    <!-- Ninja Hood Backdrop -->
    <path d="M150 20 C100 20, 50 100, 50 200 C50 280, 100 300, 150 300 C200 300, 250 280, 250 200 C250 100, 200 20, 150 20 Z" fill="#111111" />
    
    <!-- Face / Skin Area -->
    <ellipse cx="150" cy="180" rx="70" ry="40" fill="#FAD6B1" />
    
    <!-- Eyes -->
    <ellipse cx="120" cy="180" rx="15" ry="20" fill="#111111" />
    <circle cx="125" cy="175" r="5" fill="#FFFFFF" />
    
    <ellipse cx="180" cy="180" rx="15" ry="20" fill="#111111" />
    <circle cx="185" cy="175" r="5" fill="#FFFFFF" />
    
    <!-- Mask (Lower Half) -->
    <path d="M80 180 Q150 220 220 180 L250 250 Q150 320 50 250 Z" fill="#333333" />
    
    <!-- Headband / Hitaikakushi -->
    <rect x="90" y="90" width="120" height="40" rx="5" fill="#E0E0E0" stroke="#555555" stroke-width="4" />
    <circle cx="100" cy="110" r="3" fill="#555555" />
    <circle cx="200" cy="110" r="3" fill="#555555" />
    
    <!-- "AN" Text on Headband -->
    <text x="150" y="122" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#111111" text-anchor="middle">AN</text>
  </g>
</svg>
